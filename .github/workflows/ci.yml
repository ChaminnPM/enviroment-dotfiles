name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: bash + shellcheck + Go + PowerShell (Linux)
    runs-on: ubuntu-latest
    steps:
      # pin: actions/checkout v4.2.2
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      # pin: actions/setup-go v5.6.0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: ui/go.mod
          cache-dependency-path: ui/go.sum

      - name: Sintaxis bash
        run: |
          set -e
          bash -n install.sh install-private.sh bootstrap.sh
          bash -n scripts/sync.sh
          bash -n scripts/lib/ui.sh
          bash -n scripts/lib/dotfiles.sh
          bash -n scripts/lib/theme.sh
          bash -n scripts/setup-git-identity.sh
          bash -n scripts/update-external-skills.sh
          bash -n scripts/apply-theme.sh
          bash -n scripts/gen-theme-go.sh
          bash -n ui/build.sh
          for f in ui/examples/split-panel/*.sh; do
            [ -f "$f" ] && bash -n "$f" || true
          done

      - name: shellcheck
        run: |
          if ! command -v shellcheck >/dev/null 2>&1; then
            sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck
          fi
          shellcheck -S warning install.sh install-private.sh bootstrap.sh scripts/sync.sh \
            scripts/lib/ui.sh scripts/lib/theme.sh scripts/lib/dotfiles.sh \
            scripts/setup-git-identity.sh scripts/update-external-skills.sh \
            scripts/apply-theme.sh scripts/gen-theme-go.sh ui/build.sh

      - name: Arranque de shell con HOME temporal
        run: |
          set -euo pipefail
          tmp="$(mktemp -d)"
          export HOME="$tmp/home"
          mkdir -p "$HOME"
          # shellcheck source=scripts/lib/dotfiles.sh
          . scripts/lib/dotfiles.sh
          dotfiles_env_path_add "$HOME/.local/bin"
          dotfiles_env_install_bashrc
          dotfiles_shell_startup_install
          dotfiles_bash_profile_install
          # ~/.bash_profile debe tener contenido real, no solo los marcadores
          body="$(awk '/^# >>> dotfiles-shell/{on=1;next} /^# <<< dotfiles-shell/{on=0;next} on{print}' "$HOME/.bash_profile")"
          printf '%s\n' "$body" | grep -qF '.bashrc'
          grep -qF 'dotfiles-env' "$HOME/.bashrc"
          grep -qF 'dotfiles-profile' "$HOME/.profile"
          test -s "$HOME/.config/enviroment-dotfiles/env.sh"
          # Login shell nueva, sin PATH heredado, debe ver el directorio persistido
          env -i HOME="$HOME" USER="$(id -un)" PATH=/usr/bin:/bin bash -lc \
            'case ":$PATH:" in *":$HOME/.local/bin:"*) exit 0;; *) exit 1;; esac'
          rm -rf "$tmp"
          echo 'arranque de shell: OK'

      - name: sync.sh no anida los assets (regresion theme/theme)
        run: |
          set -euo pipefail
          tmp="$(mktemp -d)"
          export HOME="$tmp/home"
          mkdir -p "$HOME"
          export OPENCODE_DIR="$HOME/.config/opencode"
          export LOG_DIR="$HOME/.local/state/enviroment-dotfiles/logs"
          # Dos passadas: con `rsync -a src dst` sin barra final, la segunda
          # creaba dst/src_basename y theme.sh dejaba de ver el tema.
          for i in 1 2; do
            bash scripts/sync.sh pull >/dev/null 2>&1 || true
          done
          test -f "$HOME/.config/enviroment-dotfiles/theme/dracula.env"
          test ! -e "$HOME/.config/enviroment-dotfiles/theme/theme"
          test -f "$OPENCODE_DIR/cli.json"
          test -f "$OPENCODE_DIR/skills/graphify/SKILL.md"
          test ! -e "$OPENCODE_DIR/skills/graphify/graphify"
          test ! -e "$OPENCODE_DIR/plugins/plugins"
          rm -rf "$tmp"
          echo 'sync sin anidamiento: OK'

      - name: Sin secretos en archivos versionados
        run: |
          set -euo pipefail
          # Excluir el propio workflow: contiene la regex literal y daria falso positivo.
          if git grep -n -E 'ghp_[A-Za-z0-9]{20}|github_pat_|xox[baprs]-|AKIA[0-9A-Z]{16}|-----BEGIN (RSA |OPENSSH |EC |DSA )?PRIVATE KEY-----' -- . ':!.github/workflows/ci.yml'; then
            echo 'ERROR: posible secreto versionado'; exit 1
          fi
          test -f config/ssh/known_hosts
          if git grep -n 'StrictHostKeyChecking=accept-new' -- '*.sh' '*.ps1' '*.psm1' \
              | grep -v '^[^:]*:[0-9]*:[[:space:]]*#' | grep -q .; then
            echo 'ERROR: SSH con accept-new'; exit 1
          fi
          echo 'secret scan y known_hosts: OK'

      - name: Validar tema Dracula y plantillas TOML
        run: |
          python3 - <<'EOF'
          import glob, json, tomllib

          theme = {}
          for raw in open('config/theme/dracula.env', encoding='utf-8'):
              line = raw.strip()
              if not line or line.startswith('#') or '=' not in line:
                  continue
              k, v = line.split('=', 1)
              v = v.strip().strip('"').strip("'")
              theme[k] = v

          required = ['THEME_NAME', 'THEME_BG', 'THEME_FG', 'THEME_PURPLE',
                      'THEME_GREEN', 'THEME_YELLOW', 'THEME_RED',
                      'THEME_FONT_FAMILY', 'THEME_FONT_SIZE', 'THEME_NERD_VERSION']
          missing = [k for k in required if not theme.get(k)]
          assert not missing, f'faltan tokens: {missing}'
          assert theme['THEME_NAME'] == 'dracula', theme['THEME_NAME']
          assert theme['THEME_FONT_FAMILY'] == 'JetBrainsMono Nerd Font'
          print('tokens de tema: OK')

          extra = {
              'THEME_WSL_WORKDIR': 'C:\\\\Users\\\\test',
              'THEME_WSL_DISTRO': 'Debian',
              'THEME_WSL_HOME': '/home/test',
          }
          ctx = dict(theme, **extra)
          for tpl in sorted(glob.glob('config/alacritty/**/*.tpl', recursive=True)):
              import re
              src = open(tpl, encoding='utf-8').read()
              rendered = re.sub(r'\{\{([A-Z0-9_]+)\}\}',
                                lambda m: ctx.get(m.group(1), m.group(0)), src)
              assert '{{' not in rendered, f'placeholder sin resolver en {tpl}'
              tomllib.loads(rendered)
              print(f'{tpl}: OK')

          cli = json.load(open('config/opencode/cli.json'))
          assert cli['theme']['name'] == theme['THEME_NAME'], cli['theme']
          print('cli.json theme: OK')

          # Windows: el esquema de WT y el tema vendorizado de oh-my-posh.
          wt = json.load(open('config/windows-terminal/dracula.json'))
          assert wt['background'] == theme['THEME_BG'], wt['background']
          assert wt['name'] == 'Dracula'
          assert not any(k.startswith('$') and k != '$comment' for k in wt), 'claves $ raras'
          omp = json.load(open('config/oh-my-posh/dracula.omp.json'))
          assert 'blocks' in omp and omp['blocks'], 'oh-my-posh sin blocks'
          print('windows-terminal + oh-my-posh: OK')

          # Manifiesto de paquetes de Windows.
          pk = json.load(open('config/windows/packages.json'))
          for section in ('base', 'custom', 'apps'):
              assert pk[section], f'{section} vacio'
              for e in pk[section]:
                  assert e.get('key'), f'{section}: entrada sin key'
                  assert e.get('command') or e.get('method'), f"{e.get('key')}: sin command/method"
                  fb = e.get('fallback')
                  if fb:
                      assert fb['url'].startswith('https://'), fb['url']
                      assert fb.get('name'), f"{e.get('key')}: fallback sin name"
          print('config/windows/packages.json: OK')
          EOF

      - name: Generador de tema de nui actualizado
        run: |
          bash scripts/gen-theme-go.sh /tmp/theme_generated.go
          diff -u ui/theme_generated.go /tmp/theme_generated.go
          echo 'ui/theme_generated.go: OK'

      - name: Tests y calidad de nui
        run: |
          set -e
          cd ui
          unformatted="$(gofmt -l . || true)"
          if [ -n "$unformatted" ]; then
            echo "archivos sin gofmt:"; printf '%s\n' "$unformatted"; exit 1
          fi
          go vet ./...
          go test -race ./...
          # El codigo debe seguir compilando para las tres plataformas:
          # Windows es soportada (se publica el .exe), Darwin es best-effort.
          GOOS=windows GOARCH=amd64 go build ./...
          GOOS=windows GOARCH=arm64 go build ./...
          GOOS=darwin GOARCH=arm64 go build ./...

      - name: Binarios de nui publicados y coherentes
        run: |
          set -euo pipefail
          bin_v="$(cat bin/VERSION)"
          ui_v="$(cat ui/VERSION)"
          [ "$bin_v" = "$ui_v" ] || {
            echo "bin/VERSION ($bin_v) != ui/VERSION ($ui_v)"; exit 1; }
          main_v="$(grep -o 'nuiVersion = "[^"]*"' ui/main.go | cut -d'"' -f2)"
          [ "$bin_v" = "$main_v" ] || {
            echo "bin/VERSION ($bin_v) != ui/main.go ($main_v)"; exit 1; }
          # Windows tiene que tener binario: es plataforma soportada.
          for t in linux-amd64 linux-arm64 windows-amd64.exe windows-arm64.exe; do
            test -s "bin/nui-$t.gz" || { echo "falta bin/nui-$t.gz"; exit 1; }
          done
          # Cada .gz publicado debe estar checksumado (los instaladores validan
          # el hash del binario descomprimido).
          missing=0
          while IFS= read -r gz; do
            name="$(basename "$gz" .gz)"
            grep -q "  $name\$" bin/SHA256SUMS || { echo "sin checksum: $name"; missing=1; }
          done < <(ls bin/nui-*.gz)
          [ "$missing" = 0 ] || exit 1
          echo "binarios nui v$bin_v: OK"

      - name: PowerShell parsea y es ASCII-only
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $files = @(Get-ChildItem -Recurse -Include *.ps1, *.psm1 -File |
              Where-Object { $_.FullName -notmatch '[\\/]node_modules[\\/]' })
          if ($files.Count -lt 12) { throw "pocos archivos PowerShell ($($files.Count))" }
          $bad = 0
          foreach ($f in $files) {
              $tokens = $null; $errors = $null
              [System.Management.Automation.Language.Parser]::ParseFile(
                  $f.FullName, [ref]$tokens, [ref]$errors) | Out-Null
              foreach ($e in $errors) {
                  $bad++
                  Write-Host "$($f.Name):$($e.Extent.StartLineNumber): $($e.Message)"
              }
              # Windows PowerShell 5.1 sin BOM lee UTF-8 como ANSI: los .ps1 y
              # .psm1 de este repo son ASCII a proposito.
              $bytes = [System.IO.File]::ReadAllBytes($f.FullName)
              $nonAscii = @($bytes | Where-Object { $_ -gt 127 })
              if ($nonAscii.Count -gt 0) {
                  $bad++
                  Write-Host "$($f.Name): $($nonAscii.Count) bytes no-ASCII (debe ser ASCII puro)"
              }
          }
          if ($bad -gt 0) { throw "$bad problemas de PowerShell" }
          Write-Host "PowerShell: $($files.Count) archivos OK"

      - name: Compatibilidad de rutas entre capas
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Import-Module ./scripts/lib/dotfiles.psm1 -Force
          # Los marcadores de bloque deben ser IDENTICOS en bash y PowerShell:
          # si uno cambia, el doctor de la otra capa deja de ver el bloque.
          $map = @{
              'dotfiles-env'        = @{ sh = 'scripts/lib/dotfiles.sh'; ps = 'scripts/lib/dotfiles.psm1' }
              'dotfiles-theme'      = @{ sh = 'scripts/apply-theme.sh';  ps = 'scripts/lib/dotfiles.psm1' }
              'dotfiles-gitconfig'  = @{ sh = 'scripts/setup-git-identity.sh'; ps = 'scripts/setup-git-identity.ps1' }
              'dotfiles-managed'    = @{ sh = 'scripts/setup-git-identity.sh'; ps = 'scripts/setup-git-identity.ps1' }
          }
          foreach ($k in $map.Keys) {
              $inSh = Select-String -LiteralPath $map[$k].sh -SimpleMatch ">>> $k" -Quiet
              $inPs = Select-String -LiteralPath $map[$k].ps -SimpleMatch ">>> $k" -Quiet
              if (-not $inSh) { throw "marker '>>> $k' ausente en $($map[$k].sh)" }
              if (-not $inPs) { throw "marker '>>> $k' ausente en $($map[$k].ps)" }
          }
          Write-Host 'marcadores gestionados sincronizados: OK'

      - name: Documentacion de plataformas presente
        run: |
          set -e
          test -f docs/PLATFORMS.md
          test -f docs/STEPS.md
          test -f docs/WINDOWS.md
          grep -qi 'WSL' docs/PLATFORMS.md
          grep -qi 'no soportad' docs/PLATFORMS.md
          # Windows debe constar como soportado y ambos instaladores citados.
          grep -qi 'Windows nativo.*Soportado' docs/PLATFORMS.md
          grep -q 'install.ps1' README.md
          grep -q 'install.sh' README.md
          grep -q 'result_format\|"shell"' docs/STEPS.md
          echo 'docs: OK'

      - name: Validar JSON del repo
        run: |
          python3 - <<'EOF'
          import json, glob
          files = glob.glob('config/opencode/**/*.json', recursive=True) \
                + glob.glob('config/opencode/plugins/**/package.json', recursive=True) \
                + glob.glob('config/windows/*.json', recursive=True) \
                + glob.glob('config/windows-terminal/*.json') \
                + glob.glob('config/oh-my-posh/*.json') \
                + glob.glob('bin/VERSION')
          for f in files:
              if f.endswith('VERSION'):
                  assert open(f).read().strip(), f'{f} vacio'
                  print(f'{f}: OK')
                  continue
              json.load(open(f))
              print(f'{f}: OK')
          EOF

  windows:
    name: PowerShell + nui + instalador (Windows)
    runs-on: windows-latest
    steps:
      # pin: actions/checkout v4.2.2
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      # pin: actions/setup-go v5.6.0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: ui/go.mod
          cache-dependency-path: ui/go.sum

      - name: go vet + go test (Windows real)
        working-directory: ui
        run: |
          go vet ./...
          go test -race ./...

      - name: Generador de tema equivalente (gen-theme-go.ps1 == .sh)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          ./scripts/gen-theme-go.ps1 -Out (Join-Path $env:RUNNER_TEMP 'theme_ps.go')
          $a = (Get-Content -LiteralPath ./ui/theme_generated.go -Raw) -replace "`r`n", "`n"
          $b = (Get-Content -LiteralPath (Join-Path $env:RUNNER_TEMP 'theme_ps.go') -Raw) -replace "`r`n", "`n"
          if ($a -ne $b) { throw 'gen-theme-go.ps1 no reproduce el mismo archivo que gen-theme-go.sh' }
          Write-Host 'generador de tema PowerShell: OK'

      - name: PSScriptAnalyzer
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if (-not (Get-Module -ListAvailable PSScriptAnalyzer)) {
              Install-Module PSScriptAnalyzer -Scope CurrentUser -Force
          }
          $out = @(Invoke-ScriptAnalyzer -Path . -Recurse -Settings ./tests/windows/PSScriptAnalyzerSettings.psd1)
          $errors = @($out | Where-Object { $_.Severity -eq 'Error' })
          if ($errors.Count -gt 0) {
              $errors | Format-List RuleName, ScriptName, Line, Message
              throw "$($errors.Count) errores de PSScriptAnalyzer"
          }
          Write-Host "PSScriptAnalyzer: $($out.Count) avisos no bloqueantes"

      - name: Pester (tests de la capa PowerShell)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if (-not (Get-Module -ListAvailable Pester)) {
              Install-Module Pester -Scope CurrentUser -Force -MinimumVersion 5.6.0
          }
          $c = New-PesterConfiguration
          $c.Run.Path = './tests/windows'
          $c.Output.Verbosity = 'Detailed'
          # PassThru: sin esto Invoke-Pester no devuelve el objeto de resultado y
          # $r.Failed sale vacio (el resumen y las anotaciones no tendrian texto).
          $c.Run.PassThru = $true
          # Sin Run.Exit: hace falta el objeto resultado para publicar el
          # resumen y para poder diagnosticar el fallo sin pedir el log crudo.
          $c.Run.Exit = $false
          $c.TestResult.Enabled = $true
          $c.TestResult.OutputPath = Join-Path $env:RUNNER_TEMP 'pester.xml'
          $r = Invoke-Pester -Configuration $c
          # Los mensajes de Pester van a stdout y el log crudo del job necesita
          # permisos de admin para leerse. Cada fallo se repite como anotacion
          # (`::error::`), que SI es legible por la API publica del check-run.
          foreach ($t in @($r.Failed)) {
              $msg = (@($t.ErrorRecord | ForEach-Object { "$($_.Exception.Message)" }) -join ' | ') -replace "[`r`n]+", ' '
              Write-Host "::error::$($t.ExpandedPath) :: $msg"
          }
          if ($env:GITHUB_STEP_SUMMARY) {
              $lines = @(
                  '### Pester (Windows)',
                  '',
                  "- Total: $($r.TotalCount)",
                  "- Pasados: $($r.PassedCount)",
                  "- Fallidos: $($r.FailedCount)",
                  "- Omitidos: $($r.SkippedCount)"
              )
              if ($r.FailedCount -gt 0) {
                  $lines += ''
                  $lines += '| Test | Error |'
                  $lines += '| --- | --- |'
                  foreach ($t in @($r.Failed | Select-Object -First 25)) {
                      $msg = (@($t.ErrorRecord | ForEach-Object { "$($_.Exception.Message)" }) -join ' ').Replace('|', '\|')
                      $lines += "| $($t.ExpandedPath) | $msg |"
                  }
              }
              Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY -Value ($lines -join "`n")
          }
          if ($r.FailedCount -gt 0) { throw "$($r.FailedCount) tests de Pester fallaron" }

      - name: bootstrap.ps1 -NonInteractive ejecuta un paso real
        shell: pwsh
        run: |
          # El resto de pasos solo miran el plan (DryRun). Este ejecuta el
          # runner de texto de verdad, que es donde se rompio el instalador en
          # una maquina real (panel sin consola = cero salida).
          $ErrorActionPreference = 'Stop'
          $home2 = Join-Path $env:RUNNER_TEMP ('run-' + [guid]::NewGuid().ToString('N'))
          New-Item -ItemType Directory -Force -Path $home2 | Out-Null
          $env:DOTFILES_HOME = $home2
          $env:REPO_DIR = $PWD.Path
          $out = & pwsh -NoProfile -File ./bootstrap.ps1 -NonInteractive -Only 'Requisitos del sistema' *>&1 | Out-String
          $rc = $LASTEXITCODE
          Write-Host $out
          if ($rc -ne 0) { throw "bootstrap.ps1 real termino con codigo $rc" }
          if ($out -notmatch 'Requisitos verificados') { throw 'el paso de requisitos no se ejecuto' }
          # [OK] o [WARN]: en el runner de CI puede faltar winget y eso degrada el
          # paso a aviso (correcto: un aviso no aborta la instalacion).
          if ($out -notmatch '\[(OK|WARN)\]\s+Requisitos del sistema') { throw 'el reporte final no lista el paso' }
          if ($out -notmatch '== REPORTE FINAL ==') { throw 'no se imprimio el reporte final' }
          Write-Host 'bootstrap.ps1 -NonInteractive: paso real OK'

      - name: bootstrap.ps1 -NonInteractive en Windows PowerShell 5.1
        shell: powershell
        run: |
          # El one-liner del README corre con `powershell`, o sea 5.1. Si algo
          # solo funciona en pwsh 7, la maquina del usuario se queda sin
          # instalador y CI no se entera. Este paso usa el runner de texto bajo
          # 5.1 real.
          # El filtro va en ASCII ('Wrappers'): el script inline se guarda y se
          # lee con la codificacion de 5.1, y un acento mal leido daria cero
          # pasos (que es justo el fallo que no queremos detectar mal).
          $ErrorActionPreference = 'Stop'
          $home2 = Join-Path $env:RUNNER_TEMP ('ps51-' + [guid]::NewGuid().ToString('N'))
          New-Item -ItemType Directory -Force -Path $home2 | Out-Null
          $env:DOTFILES_HOME = $home2
          $env:REPO_DIR = $PWD.Path
          $out = & powershell.exe -NoProfile -ExecutionPolicy Bypass -File ./bootstrap.ps1 -NonInteractive -Only 'Wrappers' *>&1 | Out-String
          $rc = $LASTEXITCODE
          Write-Host $out
          if ($rc -ne 0) { throw "bootstrap.ps1 en 5.1 termino con codigo $rc" }
          if ($out -notmatch 'sync-dotfiles instalado') { throw 'el paso de wrappers no se ejecuto en 5.1' }
          if ($out -notmatch 'REPORTE FINAL') { throw '5.1 no imprimio el reporte final' }
          Write-Host 'bootstrap.ps1 en Windows PowerShell 5.1: OK'

      - name: bootstrap.ps1 -DryRun produce un plan valido
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $home2 = Join-Path $env:RUNNER_TEMP ('dry-' + [guid]::NewGuid().ToString('N'))
          New-Item -ItemType Directory -Force -Path $home2 | Out-Null
          $env:DOTFILES_HOME = $home2
          $raw = & pwsh -NoProfile -File ./bootstrap.ps1 -DryRun | Out-String
          $i = $raw.IndexOf('{')
          if ($i -lt 0) { throw "bootstrap.ps1 -DryRun no emitio JSON`n$raw" }
          $plan = $raw.Substring($i) | ConvertFrom-Json
          if ($plan.shell -ne 'pwsh') { throw "shell=$($plan.shell), esperaba pwsh" }
          if (@($plan.steps).Count -lt 16) { throw "solo $($plan.steps.Count) pasos" }
          foreach ($s in $plan.steps) {
              if (-not $s.argv -or $s.argv.Count -lt 5) { throw "paso '$($s.title)' sin argv" }
              if ((Split-Path -Leaf $s.argv[-1]) -notlike 'step-*.ps1') { throw "paso '$($s.title)': argv no apunta a step-NN.ps1" }
              if ($s.title -notmatch '\S') { throw 'paso sin titulo' }
          }
          # La identidad Git debe traer el formulario condicional de 3 cuentas.
          $id = @($plan.steps | Where-Object { $_.title -like 'Identidad*' })
          if ($id.Count -ne 1) { throw 'falta el paso de identidad Git' }
          if (@($id[0].inputs).Count -lt 16) { throw "identidad con $($id[0].inputs.Count) campos, esperaba 16" }
          $showif = @($id[0].inputs | Where-Object { $_.show_if })
          if ($showif.Count -lt 9) { throw 'los espacios no tienen show_if' }
          Write-Host "plan: $($plan.steps.Count) pasos, identidad con $($id[0].inputs.Count) campos"

      - name: bootstrap.ps1 -DryRun -SkipGit omite la identidad
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $home2 = Join-Path $env:RUNNER_TEMP ('skipgit-' + [guid]::NewGuid().ToString('N'))
          New-Item -ItemType Directory -Force -Path $home2 | Out-Null
          $env:DOTFILES_HOME = $home2
          $raw = & pwsh -NoProfile -File ./bootstrap.ps1 -DryRun -SkipGit | Out-String
          $plan = $raw.Substring($raw.IndexOf('{')) | ConvertFrom-Json
          $ids = @($plan.steps | Where-Object { $_.title -like '*dentidad*' -or $_.title -like '*laves SSH*' })
          if ($ids.Count -ne 0) { throw "-SkipGit no omitio los pasos de identidad: $($ids.title -join ', ')" }
          Write-Host "-SkipGit: $($plan.steps.Count) pasos (sin identidad)"

      - name: nui.exe instalado desde el repo y verificado
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $home2 = Join-Path $env:RUNNER_TEMP ('nui-' + [guid]::NewGuid().ToString('N'))
          New-Item -ItemType Directory -Force -Path $home2 | Out-Null
          $env:DOTFILES_HOME = $home2
          $env:REPO_DIR = $PWD.Path
          Import-Module ./scripts/lib/dotfiles.psm1 -Force
          Import-Module ./scripts/lib/ui.psm1 -Force
          $bin = Add-DotfilesUi -Force
          if (-not $bin -or -not (Test-Path -LiteralPath $bin)) { throw 'Add-DotfilesUi no instalo nui' }
          $v = & $bin version
          $want = (Get-Content ./bin/VERSION -Raw).Trim()
          if ("$v" -notlike "*$want*") { throw "nui $v, esperaba $want" }
          # ACL: nui se instala con permisos de usuario, sin heredacion.
          $sids = Get-DotfilesAclSids -Path $bin
          Write-Host "nui $v en $bin (ACL: $($sids -join ', '))"
          # Contract: el plan pwsh se ejecuta con el binario publicado.
          $p = New-DotfilesPanel -Title 'CI'
          $p = Add-DotfilesPanelStep -Panel $p -Title 'Paso CI' -Body { Write-Output '##log hola' }
          $planFile = Join-Path $home2 'plan.json'
          [IO.File]::WriteAllText($planFile, (ConvertTo-DotfilesPlanJson -Panel $p), (New-Object System.Text.UTF8Encoding($false)))
          $out = & $bin steps run --plan $planFile --log-dir $home2 --plain --non-interactive | Out-String
          if ($LASTEXITCODE -ne 0) { throw "nui steps run fallo ($LASTEXITCODE)`n$out" }
          if ($out -notlike '*hola*') { throw 'el paso no emitio su ##log' }

      - name: setup-git-identity.ps1 en home desechable
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $home2 = Join-Path $env:RUNNER_TEMP ('id-' + [guid]::NewGuid().ToString('N'))
          New-Item -ItemType Directory -Force -Path $home2 | Out-Null
          $env:DOTFILES_HOME = $home2
          $env:REPO_DIR = $PWD.Path
          $env:NUI_NONINTERACTIVE = '1'
          $env:GIT_PERSONAL_PLATFORM = 'github'
          $env:GIT_PERSONAL_NAME = 'CI Person'
          $env:GIT_PERSONAL_EMAIL = 'ci@example.com'
          $env:GIT_ACC_COUNT = '1'
          $env:GIT_ACC1_ESPACIO = 'Nuxiba'
          $env:GIT_ACC1_PLATFORM = 'bitbucket'
          $env:GIT_ACC1_NAME = 'CI Trabajo'
          $env:GIT_ACC1_EMAIL = 'trabajo@example.com'
          & pwsh -NoProfile -File ./scripts/setup-git-identity.ps1
          if ($LASTEXITCODE -ne 0) { throw "setup-git-identity salio con $LASTEXITCODE" }
          if (-not (Test-Path -LiteralPath "$home2\.ssh\id_ed25519_personal")) { throw 'sin clave personal' }
          if (-not (Test-Path -LiteralPath "$home2\.ssh\id_ed25519_nuxiba")) { throw 'sin clave del espacio' }
          $gc = Get-Content -LiteralPath "$home2\.gitconfig" -Raw
          if ($gc -notmatch 'includeIf "gitdir:[^"]+/"') { throw "includeIf mal: $gc" }
          # ACL de la clave privada: OpenSSH la rechazaria si estuviera abierta.
          Import-Module ./scripts/lib/dotfiles.psm1 -Force
          if (-not (Test-DotfilesPrivateAcl -Path "$home2\.ssh\id_ed25519_personal")) {
              throw 'la clave personal tiene ACL abierta'
          }
          Write-Host 'identidad Git en Windows: claves, includeIf y ACLs OK'
